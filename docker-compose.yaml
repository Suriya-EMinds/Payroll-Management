services:

  mysql-db:
    image: mysql:8.0
    container_name: payroll_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payroll_management
    ports:
      - "3307:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      timeout: 20s
      retries: 10

  api:
    build: .
    container_name: payroll_fastapi
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=payroll_management

  admin-panel:
    build: .
    container_name: payroll_streamlit
    command: streamlit run admin_panel.py --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api


